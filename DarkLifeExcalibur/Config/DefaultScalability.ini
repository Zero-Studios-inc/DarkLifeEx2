; Config/DefaultScalability.ini
; Arranque "Rápido": low agresivo para reducir picos al inicio.

[ScalabilitySettings]
; Opcional: evita cambios raros por hardware benchmark
PerfIndexThresholds_ResolutionQuality="50 70 85 100"
PerfIndexThresholds_ViewDistanceQuality="10 25 45 70"
PerfIndexThresholds_AntiAliasingQuality="10 25 45 70"
PerfIndexThresholds_ShadowQuality="10 25 45 70"
PerfIndexThresholds_PostProcessQuality="10 25 45 70"
PerfIndexThresholds_TextureQuality="10 25 45 70"
PerfIndexThresholds_EffectsQuality="10 25 45 70"
PerfIndexThresholds_FoliageQuality="10 25 45 70"
PerfIndexThresholds_ShadingQuality="10 25 45 70"

[ScalabilityGroups]
; 0=Low, 1=Medium, 2=High, 3=Epic
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0
sg.GlobalIlluminationQuality=0
sg.ReflectionQuality=0

; -------------------------
; LOW (0) - super liviano
; -------------------------

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6
foliage.LODDistanceScale=1.5

[AntiAliasingQuality@0]
r.PostProcessAAQuality=2
r.TemporalAA.Upsampling=0
r.TSR.Quality=1

[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.MaxResolution=512
r.Shadow.CSM.MaxCascades=1
r.Shadow.DistanceScale=0.6
r.ContactShadows=0

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=2
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=0
r.SSR.Quality=0
r.Tonemapper.Sharpen=0.0

[TextureQuality@0]
r.Streaming.MipBias=1
r.MaxAnisotropy=2
r.Streaming.Boost=0

[EffectsQuality@0]
r.TranslucencyVolumeBlur=0
r.ParticleLightQuality=0
r.RefractionQuality=0

[FoliageQuality@0]
foliage.DensityScale=0.5
grass.DensityScale=0.5

[ShadingQuality@0]
r.MaterialQualityLevel=0

; -------------------------
; MEDIUM (1) - intermedio
; -------------------------

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.8
foliage.LODDistanceScale=1.2

[AntiAliasingQuality@1]
r.PostProcessAAQuality=4
r.TSR.Quality=2

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.8
r.ContactShadows=0

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=1
r.BloomQuality=3
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=1
r.SSR.Quality=1

[TextureQuality@1]
r.Streaming.MipBias=0
r.MaxAnisotropy=4

[EffectsQuality@1]
r.ParticleLightQuality=1
r.RefractionQuality=1

[FoliageQuality@1]
foliage.DensityScale=0.7
grass.DensityScale=0.7

[ShadingQuality@1]
r.MaterialQualityLevel=1

; -------------------------
; HIGH (2) - ideal
; -------------------------

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
foliage.LODDistanceScale=1.0

[AntiAliasingQuality@2]
r.PostProcessAAQuality=5
r.TSR.Quality=3

[ShadowQuality@2]
r.ShadowQuality=3
r.Shadow.MaxResolution=1536
r.Shadow.CSM.MaxCascades=3
r.Shadow.DistanceScale=1.0
r.ContactShadows=1

[PostProcessQuality@2]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=2
r.BloomQuality=4
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=2
r.SSR.Quality=2

[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=8

[EffectsQuality@2]
r.ParticleLightQuality=2
r.RefractionQuality=2

[FoliageQuality@2]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ShadingQuality@2]
r.MaterialQualityLevel=1
