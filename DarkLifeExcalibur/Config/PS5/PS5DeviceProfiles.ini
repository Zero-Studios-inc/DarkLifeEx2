; Perfil equilibrado de PS5 para salida a 60 FPS.
; Hereda los valores recomendados por Epic para PS5 y solo ajusta los puntos
; que afectan directamente la claridad, las sombras, los FX y la geometria lejana.

[PS5 DeviceProfile]
DeviceType=PS5
BaseProfileName=PS5_Base_60

; TSR y resolucion dinamica: conserva claridad y recupera GPU en escenas pesadas.
+CVars=r.DynamicRes.OperationMode=2
+CVars=r.DynamicRes.FrameTimeBudget=16.66
+CVars=r.DynamicRes.TargetedGPUHeadRoomPercentage=5.0
+CVars=r.DynamicRes.MinScreenPercentage=55
+CVars=r.DynamicRes.MaxScreenPercentage=85
+CVars=r.SecondaryScreenPercentage.GameViewport=100
+CVars=r.AntiAliasingMethod=4
+CVars=sg.AntiAliasingQuality=3
+CVars=r.Tonemapper.Sharpen=0.15

; Sombras: mas detalle cerca de la camara, menor coste en luces moviles y lejanas.
+CVars=sg.ShadowQuality=3
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.Shadow.Virtual.OnePassProjection=1
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
+CVars=r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
+CVars=r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0
+CVars=r.Shadow.Virtual.ResolutionLodBiasLocal=0
+CVars=r.Shadow.Virtual.ResolutionLodBiasLocalMoving=0.5
+CVars=r.Shadow.Virtual.DistantLightMode=1
+CVars=r.Shadow.Virtual.MaxDistantUpdatePerFrame=1
+CVars=r.Shadow.NaniteLODBias=1.0

; Geometria: calidad completa en personajes y LOD mas temprano en el fondo.
+CVars=sg.ViewDistanceQuality=3
+CVars=r.ViewDistanceScale=1.0
+CVars=r.StaticMeshLODDistanceScale=1.15
+CVars=r.SkeletalMeshLODBias=0
+CVars=foliage.LODDistanceScale=0.90
+CVars=r.Nanite.MaxPixelsPerEdge=1.15
+CVars=r.Nanite.Culling.HZB=1
+CVars=r.Nanite.Culling.Frustum=1
+CVars=r.Nanite.Culling.DrawDistance=1

; Particulas: calidad alta visible, con culling y reutilizacion para evitar picos.
+CVars=sg.EffectsQuality=3
+CVars=fx.Niagara.QualityLevel=3
+CVars=fx.Niagara.Scalability.VisibilityCulling=1
+CVars=fx.Niagara.Scalability.DistanceCulling=1
+CVars=fx.Niagara.Scalability.InstanceCountCulling=1
+CVars=fx.Niagara.WorldManager.ObjectPoolEnabled=1
+CVars=fx.Niagara.AllowPrimedPools=1
+CVars=fx.Niagara.WorldManager.SpawnPerTickGroup=1

; Memoria de texturas alineada con el perfil oficial de PS5 a 60 FPS.
+CVars=sg.TextureQuality=3
+CVars=r.Streaming.LimitPoolSizeToVRAM=1
+CVars=r.Streaming.PoolSize=2048
