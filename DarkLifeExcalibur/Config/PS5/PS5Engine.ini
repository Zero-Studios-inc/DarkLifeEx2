[/Script/Engine.RendererSettings]
; ---------- LUMEN (alto, sin RT HW) ----------
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=1
r.RayTracing=0
r.Lumen.HardwareRayTracing=0
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.SceneLightingQuality=4
r.Lumen.Reflections.Quality=3
r.Lumen.Reflections.Temporal=1
r.Lumen.Reflections.ScreenTraces=1
r.Lumen.ScreenProbeGather.ScreenTraces=1
r.Lumen.TranslucencyReflections=0        ; off para ahorrar VRAM sin perder look

; ---------- SOMBRAS (VSM alta y nítidas) ----------
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=5120   ; 5632→5120: margen de memoria
r.Shadow.MaxResolution=3072
r.Shadow.CSM.MaxCascades=3
r.Shadow.Quality=4                       ; 5 apenas aporta y sube coste
r.ContactShadows=1
r.Shadow.RadiusThreshold=0.012

; ---------- NANITE ----------
r.Nanite=1
r.Nanite.MaxTrianglesPerFrame=2800000    ; 3.2M→2.8M: evita picos
r.Nanite.MaxRasterizedPrimsPerFrame=2800000

; ========== SUAVIZADO / DISTANCIA ==========
r.AntiAliasingMethod=3                   ; TSR
r.TemporalAA.Upsampling=1
r.TSR.Quality=4
r.PostProcessAAQuality=6

; TAA/TSR más suave (quita “sobre-enfoque” y shimmer)
r.TemporalAA.SampleCount=24
r.TemporalAA.FilterSize=1.8
r.TemporalAA.Algorithm=1
r.TemporalAA.UpsampleFiltered=1
r.TemporalAA.R11G11B10History=1
r.TemporalAA.HistoryScreenPercentage=100
r.TemporalAA.HistoryWeight=0.94          ; más estabilidad, menos dientes
r.Tonemapper.Sharpen=0.08                ; nitidez controlada (sin halos)
r.ViewTextureMipBias=0.33                ; suaviza texturas lejanas

; Follaje/pelo: mejor transición y AA
foliage.DitheredLOD=1
r.Foliage.DitheredLOD=1
r.HairStrands.AntiAliasing=2
r.HairStrands.VelocityType=1

; ---------- ATMÓSFERA / NIEBLA ----------
r.SkyAtmosphere=1
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.MultiScatteringLUT.HighQuality=1
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=14         ; 12→14: casi igual, menos coste
r.VolumetricFog.GridSizeZ=88             ; 96→88: estabilidad/VRAM
r.VolumetricFog.HistoryWeight=0.95
r.Fog=1
r.ExponentialHeightFog=1

; ---------- TEXTURAS / STREAMING ----------
r.MaxAnisotropy=16
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1550                ; 1650→1550: margen contra OOM
r.Streaming.MaxTempMemoryAllowed=96
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.DefragDynamicBounds=1

; ---------- POST / COLOR ----------
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AmbientOcclusion=1
r.DefaultFeature.Bloom=1
r.DefaultFeature.MotionBlur=1
r.SSR.Quality=3
r.SSR.Temporal=1
r.AmbientOcclusionLevels=3
r.AmbientOcclusionMaxQuality=100
r.AmbientOcclusionRadiusScale=1.2
r.BloomQuality=5
r.DepthOfFieldQuality=3
r.MotionBlurQuality=4
r.TonemapperGamma=2.2
r.TonemapperFilm=1
r.SceneColorFringeQuality=0
r.Color.Saturation=1.05
r.Color.Contrast=1.12                    ; 1.15→1.12 para evitar aplastar sombras

; ---------- DISTANCIAS / LOD ----------
r.ViewDistanceScale=1.05
r.StaticMeshLODDistanceScale=0.95
r.SkeletalMeshLODBias=0

; ---------- ESTABILIDAD ----------
t.MaxFPS=60
r.ScreenPercentage=95                    ; 102→95: menos aliasing con TSR y más headroom
log.Audio=Error
log.Streaming=Warning
